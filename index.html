<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUET CSE Routine Assistant</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #f7f7f8; }
  h1 { font-size: 1.3rem; }
  #chat { border: 1px solid #ddd; border-radius: 12px; padding: 16px; min-height: 340px; max-height: 480px;
          overflow-y: auto; background: white; margin-bottom: 12px; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 10px; max-width: 85%; line-height: 1.4; }
  .user { background: #e9ebff; margin-left: auto; text-align: right; }
  .bot { background: #f0f0f0; }
  .row { display: flex; gap: 8px; }
  #msg { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
  button { padding: 10px 18px; border: none; border-radius: 8px; background: #4f46e5; color: white; cursor: pointer; }
  button:disabled { background: #aaa; }
  .hint { color: #888; font-size: 0.85rem; margin-top: 8px; }
</style>
</head>
<body>
  <h1>📅 KUET CSE Routine Assistant</h1>
  <div id="chat"></div>
  <div class="row">
    <input id="msg" placeholder="e.g. Total labs for A1 in 1 week?" autocomplete="off">
    <button id="sendBtn" onclick="send()">Send</button>
  </div>
  <p class="hint">Answers are generated from the official 4th Year 1st Term routine.</p>

  <script>
    // Replace with your actual Hugging Face Space URL once created:
    const API_URL = "https://routine-backend-2.onrender.com/ask";

    const chat = document.getElementById('chat');
    const input = document.getElementById('msg');
    const btn = document.getElementById('sendBtn');

    function addMessage(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const question = input.value.trim();
      if (!question) return;
      addMessage(question, 'user');
      input.value = '';
      btn.disabled = true;
      addMessage('Thinking…', 'bot');

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: question })
        });
        const data = await res.json();
        chat.lastChild.textContent = data.answer;
      } catch (err) {
        chat.lastChild.textContent = "Couldn't reach the server. Please try again.";
      } finally {
        btn.disabled = false;
      }
    }

    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
